name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kidar/core test
      - run: pnpm --filter @kidar/web test
      - run: pnpm --filter @kidar/web lint
      - run: pnpm --filter @kidar/web typecheck
      - run: pnpm --filter @kidar/web build

  e2e-gate:
    name: E2E gate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.presence.outputs.enabled }}
    steps:
      # Reads APPWRITE_E2E_API_KEY only inside step env. Job-level if cannot use secrets.
      - id: presence
        env:
          APPWRITE_E2E_API_KEY: ${{ secrets.APPWRITE_E2E_API_KEY }}
        run: |
          if [ -n "$APPWRITE_E2E_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E
    needs: e2e-gate
    if: needs.e2e-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # Dedicated CI/E2E Appwrite project only — never Development/Production.
    # Required when this job runs: APPWRITE_E2E_API_KEY, APPWRITE_E2E_ENDPOINT,
    # APPWRITE_E2E_PROJECT_ID. Optional ID overrides, applied only when set:
    # APPWRITE_E2E_DATABASE_ID, APPWRITE_E2E_PROFILES_COLLECTION,
    # APPWRITE_E2E_PROJECTS_COLLECTION, APPWRITE_E2E_JOBS_COLLECTION,
    # APPWRITE_E2E_SOURCE_BUCKET, APPWRITE_E2E_ASSETS_BUCKET.
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_E2E_ENDPOINT }}
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_E2E_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_E2E_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply optional Appwrite E2E resource overrides
        env:
          APPWRITE_E2E_DATABASE_ID: ${{ secrets.APPWRITE_E2E_DATABASE_ID }}
          APPWRITE_E2E_PROFILES_COLLECTION: ${{ secrets.APPWRITE_E2E_PROFILES_COLLECTION }}
          APPWRITE_E2E_PROJECTS_COLLECTION: ${{ secrets.APPWRITE_E2E_PROJECTS_COLLECTION }}
          APPWRITE_E2E_JOBS_COLLECTION: ${{ secrets.APPWRITE_E2E_JOBS_COLLECTION }}
          APPWRITE_E2E_SOURCE_BUCKET: ${{ secrets.APPWRITE_E2E_SOURCE_BUCKET }}
          APPWRITE_E2E_ASSETS_BUCKET: ${{ secrets.APPWRITE_E2E_ASSETS_BUCKET }}
        run: |
          set_if_present() {
            local target="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "${target}=${value}" >> "$GITHUB_ENV"
            fi
          }
          set_if_present APPWRITE_DATABASE_ID "$APPWRITE_E2E_DATABASE_ID"
          set_if_present APPWRITE_PROFILES_COLLECTION "$APPWRITE_E2E_PROFILES_COLLECTION"
          set_if_present APPWRITE_PROJECTS_COLLECTION "$APPWRITE_E2E_PROJECTS_COLLECTION"
          set_if_present APPWRITE_JOBS_COLLECTION "$APPWRITE_E2E_JOBS_COLLECTION"
          set_if_present APPWRITE_SOURCE_BUCKET "$APPWRITE_E2E_SOURCE_BUCKET"
          set_if_present APPWRITE_ASSETS_BUCKET "$APPWRITE_E2E_ASSETS_BUCKET"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
